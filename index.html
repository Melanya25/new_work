<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Калькулятор среднего балла</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h2>Введите оценки по 5 предметам</h2>
        <form method="POST" action="/calculate">
            <div class="form-group">
                <label for="grade1">Предмет 1:</label>
                <input type="number" id="grade1" name="grade1" min="1" max="5" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="grade2">Предмет 2:</label>
                <input type="number" id="grade2" name="grade2" min="1" max="5" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="grade3">Предмет 3:</label>
                <input type="number" id="grade3" name="grade3" min="1" max="5" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="grade4">Предмет 4:</label>
                <input type="number" id="grade4" name="grade4" min="1" max="5" step="0.1" required>
            </div>
            <div class="form-group">
                <label for="grade5">Предмет 5:</label>
                <input type="number" id="grade5" name="grade5" min="1" max="5" step="0.1" required>
            </div>
            <button type="submit">Рассчитать</button>
        </form>
    </div>
</body>
</html>
